    name: CI

    on: 
        push:
            branches: [main]
        pull_request:

    jobs:
        tests:
            name: Tests
            runs-on: ubuntu-latest
            steps:
                    - name: Checkout code
                      uses: actions/checkout@v4

                    - name: Set up Node.js
                      uses: actions/setup-node@v4
                      with:
                          node-version: '22'
                          cache: 'npm'

                    - name: Install dependencies
                      run: npm ci


                    - run: npm run test -- --coverage
        style:
            name: Style
            runs-on: ubuntu-latest
            steps:
                    - name: Checkout code
                      uses: actions/checkout@v4

                    - name: Set up Node.js
                      uses: actions/setup-node@v4
                      with:
                          node-version: '22'
                          cache: 'npm'

                    - name: Install dependencies
                      run: npm ci
                    
                    - name: Check formatting
                      run: npm run format -- --check
                    - name: Check linting
                      run: npm run lint -- --max-warnings=0
